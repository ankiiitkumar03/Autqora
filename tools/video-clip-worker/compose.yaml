services:
  autqora-video-clip-worker:
    build: .
    container_name: autqora-video-clip-worker
    restart: unless-stopped
    environment:
      CLIP_WORKER_API_KEY: ${CLIP_WORKER_API_KEY:?Set CLIP_WORKER_API_KEY in .env}
      PUBLIC_BASE_URL: http://localhost:8090
      CLIP_RETENTION_SECONDS: ${CLIP_RETENTION_SECONDS:-604800}
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - autqora_clips:/app/clips
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=4)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  autqora_clips:
